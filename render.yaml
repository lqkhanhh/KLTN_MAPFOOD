# Free demo infrastructure. Database is created separately on Neon Free.
# Names below are service names, not guaranteed available hostnames.
services:
  - type: web
    name: routebite-api-demo
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm run migration:run:prod && npm run start:prod
    healthCheckPath: /api/docs
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      - key: DB_SYNCHRONIZE
        value: "false"
      - key: DB_MIGRATIONS_RUN
        value: "false"
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: EMAIL_OTP_SECRET
        generateValue: true
      - key: MERCHANT_DOCUMENT_ENCRYPTION_KEY
        sync: false
      - key: PAYMENT_PROVIDER
        value: VNPAY
      - key: VNPAY_TMN_CODE
        sync: false
      - key: VNPAY_HASH_SECRET
        sync: false
      - key: VNPAY_URL
        value: https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
      - key: VNPAY_RETURN_URL
        sync: false
      - key: AUTH_EMAIL_OTP_ENABLED
        value: "true"
      - key: BREVO_API_KEY
        sync: false
      - key: BREVO_SENDER_EMAIL
        sync: false
      - key: BREVO_SENDER_NAME
        value: RouteBite
      - key: EMAIL_OTP_DAILY_LIMIT
        value: "250"
      - key: AUTH_GOOGLE_ENABLED
        value: "true"
      - key: AUTH_APPLE_ENABLED
        value: "false"
      - key: AUTH_PHONE_ENABLED
        value: "false"
      - key: FIREBASE_PROJECT_ID
        sync: false
      - key: FIREBASE_WEB_API_KEY
        sync: false
      - key: FIREBASE_AUTH_DOMAIN
        sync: false
      - key: FIREBASE_WEB_APP_ID
        sync: false
      - key: GOOGLE_APPLICATION_CREDENTIALS
        value: /etc/secrets/firebase-service-account.json
      - key: GOOGLE_ROUTES_API_KEY
        sync: false
  - type: web
    name: routebite-web-demo
    runtime: static
    rootDir: web
    buildCommand: npm ci && npm run build:deploy
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: 22.16.0
      - key: PUBLIC_API_BASE
        sync: false
      - key: GOOGLE_MAPS_BROWSER_KEY
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
