services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: routebite
      POSTGRES_USER: routebite
      POSTGRES_PASSWORD: routebite
    ports:
      - '5432:5432'
    volumes:
      - routebite_postgres:/var/lib/postgresql/data
      - ./docker/init-postgis.sql:/docker-entrypoint-initdb.d/01-postgis.sql:ro
volumes:
  routebite_postgres:
